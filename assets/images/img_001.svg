<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Huawei flower/petal logo -->
  <g transform="translate(8,5)">
    <!-- Center -->
    <ellipse cx="24" cy="25" rx="3.5" ry="3.5" fill="#CF0A2C"/>
    <!-- Top petal -->
    <ellipse cx="24" cy="13" rx="4.5" ry="7.5" fill="#CF0A2C" opacity="0.9"/>
    <!-- Bottom petal -->
    <ellipse cx="24" cy="37" rx="4.5" ry="7.5" fill="#CF0A2C" opacity="0.9"/>
    <!-- Left petal -->
    <ellipse cx="12" cy="25" rx="7.5" ry="4.5" fill="#CF0A2C" opacity="0.9"/>
    <!-- Right petal -->
    <ellipse cx="36" cy="25" rx="7.5" ry="4.5" fill="#CF0A2C" opacity="0.9"/>
    <!-- Top-left petal -->
    <ellipse cx="15.5" cy="15.5" rx="4.5" ry="7.5" fill="#CF0A2C" opacity="0.85" transform="rotate(-45,15.5,15.5)"/>
    <!-- Top-right petal -->
    <ellipse cx="32.5" cy="15.5" rx="4.5" ry="7.5" fill="#CF0A2C" opacity="0.85" transform="rotate(45,32.5,15.5)"/>
    <!-- Bottom-left petal -->
    <ellipse cx="15.5" cy="34.5" rx="4.5" ry="7.5" fill="#CF0A2C" opacity="0.85" transform="rotate(45,15.5,34.5)"/>
    <!-- Bottom-right petal -->
    <ellipse cx="32.5" cy="34.5" rx="4.5" ry="7.5" fill="#CF0A2C" opacity="0.85" transform="rotate(-45,32.5,34.5)"/>
  </g>
  <!-- HUAWEI text -->
  <text x="58" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#1a1a1a" letter-spacing="1">HUAWEI</text>
</svg>